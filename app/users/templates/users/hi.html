{% extends 'base.html' %}
{% block title %} Greeting Page {% endblock %}
{% block content %}
<nav class="userlist">
    <ul>
        <li>
            <a href="{{ url_for('users.greetings', name='John', age=30)}}">Greet John</a>
        </li>
        <li>
            <a href="{{ url_for('users.admin') }}">Admin</a>
        </li>
    </ul>
</nav>
    <h1>Hello :) </h1>
    <h1>User: {{name | title | upper}}</h1> <!-- | - фільтр-->
    {% if age %}
        <h1 class="age-text age-provided">Age: {{age}}</h1>
    {% else %}
        <h1 class="age-text age-missing">Age empty</h1>
    {% endif %}

{% endblock %}
