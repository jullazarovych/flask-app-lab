{% extends 'base.html' %}
{% block title %} Login {% endblock %}

{% block content %}
<h2>Login</h2>

<form method="post">
    <label>Ім'я користувача:</label>
    <input type="text" name="username" required>
    <br>
    <label>Пароль:</label>
    <input type="password" name="password" required>
    <br>
    <button type="submit">Увійти</button>
</form>
{% endblock %}
