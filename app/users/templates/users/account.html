{% extends 'base.html' %}

{% block title %}Account{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Your Profile</h2>
    <p><strong>Username:</strong> {{ username }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <a href="{{ url_for('user_name.logout') }}" class="btn btn-danger">Logout</a>
</div>
{% endblock %}
