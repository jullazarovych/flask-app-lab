{% extends 'base.html' %}
{% block title %}POSTS{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('.static', filename='css/post.css') }}">
{% endblock %}

{% block content %}

<h1 class="my_style">Articles</h1>
<div class="card-container">
    {% for post in posts %}
        <div class="card">
            <img src="{{ url_for('.static', filename='images/480.png')}}" 
                 alt="Post Image" class="card-image">
            <div class="card-content">
                <h2>{{ post["title"] }}</h2>
                <p>{{ post["content"] | truncate(23) }}</p>
                <a href="{{ url_for('posts.detail_post', id=post['id']) }}">Read more</a>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
