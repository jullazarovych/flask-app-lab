{% extends 'base.html' %}
{% block title %} POSTS DETAILS {% endblock %}
{% block content %}

    <h1>Post № {{post.id}} — {{post.title}}</h1>
    <p><strong>Author:</strong> {{ post.author }}</p>
    <p><strong>Category:</strong> {{ post.category }}</p>
    <p><strong>Published:</strong> {{ post.posted.strftime('%Y-%m-%d') }}</p>
    <hr>
    <p>{{post.content}}</p>
    <form method="POST" action="{{ url_for('posts.delete_post', id=post.id) }}" style="display:inline;">
        <button type="submit" onclick="return confirm('Are you sure you want to delete this post?')">Delete</button>
    </form>
    <a href="{{ url_for('posts.get_posts')}}">Return posts </a>
   
    {% endblock %}
